apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: php
          image: ghcr.io/tsundoku-group/php:prod
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: backend-volume
              mountPath: /var/www/backend
      volumes:
        - name: backend-volume
          emptyDir: {}