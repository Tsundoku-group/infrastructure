name: Build & Push Docker Images

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/tsundoku-group

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v3

      - name: Checkout backend
        uses: actions/checkout@v3
        with:
          repository: tsundoku-group/backend
          token: ${{ secrets.GITHUB_TOKEN }}
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v3
        with:
          repository: tsundoku-group/frontend
          token: ${{ secrets.GITHUB_TOKEN }}
          path: frontend

      - name: Set image tag date
        run: echo "DATE_TAG=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Required Secrets
        run: |
          test -n "${{ secrets.GITHUB_TOKEN }}" || (echo "Missing GITHUB_TOKEN" && exit 1)

      - name: Validate Docker Compose Config
        run: docker compose -f compose/prod/docker-compose.yaml config

      - name: Security Scan PHP Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ghcr.io/tsundoku-group/php:prod
          format: table
          severity: HIGH,CRITICAL

      - name: Build & Push PHP Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ../infrastructure/docker/php/prod/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/php:prod
            ${{ env.IMAGE_PREFIX }}/php:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/php:${{ env.DATE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/php:prod
          cache-to: type=inline

      - name: Build & Push Next.js Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ../infrastructure/docker/nextjs/prod/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nextjs:prod
            ${{ env.IMAGE_PREFIX }}/nextjs:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/nextjs:${{ env.DATE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/nextjs:prod
          cache-to: type=inline
