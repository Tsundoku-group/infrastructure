# ===========================================
# Dev Docker Compose - Tsundoku
# Services suffixés par -dev pour clarté
# ===========================================

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-dev
    volumes:
      - ../../../backend:/var/www/backend
      - ../../docker/nginx/dev/conf.d:/etc/nginx/conf.d
    networks:
      - app_network
    command: nginx -g 'daemon off;'

  php:
    build:
      context: ../../../backend
      dockerfile: ../infrastructure/docker/php/dev/Dockerfile
    container_name: php-dev
    volumes:
      - ../../../backend:/var/www/backend
      - tsundoku-vendor-data:/var/www/backend/vendor
      - ../../docker/php/dev/php.ini:/usr/local/etc/php/php.ini
    environment:
      APP_ENV: ${APP_ENV}
    networks:
      - app_network

  nextjs:
    build:
      context: ../../../frontend
      dockerfile: ../infrastructure/docker/nextjs/dev/Dockerfile
    container_name: nextjs-dev
    platform: linux/amd64
    volumes:
      - ../../../frontend:/app
    networks:
      - app_network
    environment:
      SYMFONY_URL: ${SYMFONY_URL}

  postgres:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tsundoku-db-data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - tsundoku-mongodb_data:/data/db
    networks:
      - app_network

  redis:
    image: redis:7
    container_name: redis-dev
    volumes:
      - tsundoku-redis-data:/data
    networks:
      - app_network

  maildev:
    image: maildev/maildev:2.0.5
    container_name: maildev-dev
    networks:
      - app_network

volumes:
  tsundoku-db-data:
  tsundoku-redis-data:
  tsundoku-mongodb_data:
  tsundoku-vendor-data:

networks:
  app_network:
    driver: bridge