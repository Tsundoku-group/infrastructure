# ===========================================
# Production Docker Compose - Tsundoku
# Services suffixés par -prod pour clarté
# Images taguées : tsundoku/<service>:prod
# ===========================================

services:
  nginx:
    image: tsundoku/nginx:latest
    container_name: nginx-prod
    volumes:
      - ./docker/nginx/prod/config.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - nextjs
    networks:
      - app_network
    ports:
      - "80:80"

  php:
    build:
      context: ../../../backend
      dockerfile: ../../docker/php/prod/Dockerfile
    image: tsundoku/php:prod
    container_name: php-prod
    environment:
      APP_ENV: prod
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - app_network

  nextjs:
    build:
      context: ../../../frontend
      dockerfile: ../../docker/nextjs/prod/Dockerfile
    image: tsundoku/nextjs:prod
    container_name: nextjs-prod
    environment:
      SYMFONY_URL: http://nginx:80
    networks:
      - app_network

  postgres:
    image: postgres:15
    container_name: postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tsundoku-db-data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb-prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - tsundoku-mongodb_data:/data/db
    networks:
      - app_network

  redis:
    image: redis:7
    container_name: redis-prod
    volumes:
      - tsundoku-redis-data:/data
    networks:
      - app_network

  maildev:
    image: maildev/maildev:2.0.5
    container_name: maildev-prod
    networks:
      - app_network
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  tsundoku-db-data:
  tsundoku-redis-data:
  tsundoku-mongodb_data:

networks:
  app_network:
    driver: bridge